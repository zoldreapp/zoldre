<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Zoldre</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #FAF8F5;
            color: #2D2D2D;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
        }
        
        .error-icon {
            font-size: 80px;
            margin-bottom: 24px;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        p {
            font-size: 17px;
            color: #666;
            margin-bottom: 32px;
        }
        
        .home-btn {
            display: inline-block;
            background: #F5A623;
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }
        
        .home-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">📷</div>
        <h1>Page Not Found</h1>
        <p>This memory doesn't exist yet. Let's go back home.</p>
        <a href="index.html" class="home-btn">Back to Zoldre</a>
    </div>
</body>
</html>
